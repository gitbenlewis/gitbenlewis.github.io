name: Deploy docs

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "docs/**"
      - "scripts/sync_pyoncoplot_docs.py"
      - "requirements-docs.txt"
      - "requirements.txt"
      - "README.md"
      - ".prettierignore"
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "docs/**"
      - "scripts/sync_pyoncoplot_docs.py"
      - "requirements-docs.txt"
      - "requirements.txt"
      - "README.md"
      - ".prettierignore"
  repository_dispatch:
    types:
      - pyoncoplot-docs-updated
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs site
        uses: actions/checkout@v4

      - name: Checkout PyOncoplot
        uses: actions/checkout@v4
        with:
          repository: gitbenlewis/PyOncoplot
          path: PyOncoplot

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Sync PyOncoplot docs
        run: |
          python scripts/sync_pyoncoplot_docs.py \
            --source PyOncoplot \
            --dest docs/pyoncoplot

      - name: Build Sphinx docs
        run: sphinx-build -W -b html docs _site

      - name: Deploy docs
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
